<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>My Movie Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#FAF8F3;color:#46372B;font-family:Inter,system-ui,sans-serif}
.serif{font-family:'Playfair Display',Georgia,serif}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:up .35s ease both}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(70,55,43,.07)}
.tap{transition:transform .15s,box-shadow .2s,background .2s}.tap:active{transform:scale(.96)}
.inp{width:100%;background:#FAF8F3;border:1px solid #D8C4A8;border-radius:12px;padding:12px;font-size:16px;color:#46372B;outline:none;transition:border .2s}
.inp:focus{border-color:#987653}
</style></head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const KEY='movieDiary.v1';
const VERDICTS=['Flop','Average','Hit','Super Hit','Blockbuster'];
const VC={'Flop':'bg-red-100 text-red-800','Average':'bg-stone-200 text-stone-700','Hit':'bg-amber-100 text-amber-800','Super Hit':'bg-emerald-100 text-emerald-800','Blockbuster':'bg-[#987653] text-white'};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const P={home:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10',film:'M4 3h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM7 3v18M17 3v18M2 12h20',chart:'M3 3v18h18M7 14l4-4 4 4 5-5',set:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',plus:'M12 5v14M5 12h14',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',x:'M18 6L6 18M6 6l12 12',search:'M21 21l-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z'};
const Ic=({d,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
const money=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fdate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const today=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const load=()=>{try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:[]}catch(e){return[]}};
const calc=ms=>{const n=ms.length,sum=ms.reduce((a,m)=>a+m.amount,0),mo={},yr={},vd={};VERDICTS.forEach(v=>vd[v]=0);
ms.forEach(m=>{const y=m.date.slice(0,4),k=m.date.slice(0,7);(mo[k]=mo[k]||{n:0,s:0}).n++;mo[k].s+=m.amount;(yr[y]=yr[y]||{n:0,s:0}).n++;yr[y].s+=m.amount;vd[m.verdict]++});
return{n,sum,avg:n?sum/n:0,max:n?Math.max(...ms.map(m=>m.amount)):0,mo,yr,vd}};

const Badge=({v})=><span className={'px-2.5 py-1 rounded-full text-xs font-medium '+VC[v]}>{v}</span>;
const Stat=({l,v})=><div className="card p-4 fade"><div className="text-xs text-[#8C8175]">{l}</div><div className="serif text-xl font-bold mt-1 text-[#987653] truncate">{v}</div></div>;
const Bars=({data})=>{const mx=Math.max(1,...data.map(d=>d.v));return <div className="flex gap-1.5 h-36">{data.map(d=><div key={d.l} className="flex-1 flex flex-col items-center h-full gap-1"><div className="flex-1 w-full flex items-end"><div title={money(d.v)} className="w-full rounded-t-lg" style={{height:(d.v?Math.max(4,d.v/mx*100):2)+'%',background:'#987653',opacity:d.v?1:.25,transition:'height .6s'}}/></div><span className="text-[10px] text-[#8C8175]">{d.l}</span></div>)}</div>};
const Empty=({t})=><div className="card p-8 text-center text-sm text-[#8C8175]">{t}</div>;
const Row=({m,onEdit,onDel})=><div className="card p-4 fade flex items-center gap-3">
<div className="flex-1 min-w-0"><div className="font-semibold truncate">{m.name}</div><div className="text-xs text-[#8C8175] mt-0.5">{fdate(m.date)}</div><div className="mt-2"><Badge v={m.verdict}/></div></div>
<div className="text-right"><div className="serif font-bold text-[#987653]">{money(m.amount)}</div>
{onEdit&&<div className="flex gap-1 mt-2 justify-end"><button aria-label="Edit" onClick={()=>onEdit(m)} className="p-2 rounded-full bg-[#F2EBDD] tap"><Ic d={P.edit} s={16}/></button><button aria-label="Delete" onClick={()=>onDel(m)} className="p-2 rounded-full bg-[#F2EBDD] text-red-700 tap"><Ic d={P.trash} s={16}/></button></div>}</div></div>;
const Title=({children,sub})=><div className="mb-4 fade"><h1 className="serif text-2xl font-bold">{children}</h1>{sub&&<p className="text-sm text-[#8C8175]">{sub}</p>}</div>;
const Btn=({children,onClick,kind,cls=''})=><button onClick={onClick} className={'tap rounded-xl px-4 py-3 text-sm font-medium '+(kind==='ghost'?'bg-[#F2EBDD] text-[#46372B] ':kind==='danger'?'bg-red-700 text-white ':'bg-[#987653] text-white ')+cls}>{children}</button>;

function Dashboard({ms,st,add,edit,del,go}){
const k=today().slice(0,7),cur=st.mo[k]||{n:0,s:0},now=new Date();
const six=[...Array(6)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1),kk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return{l:MN[d.getMonth()],v:(st.mo[kk]||{s:0}).s}});
const recent=[...ms].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5);
return <div className="space-y-5">
<Title sub="Your personal cinema journal">My Movie Diary</Title>
<Btn onClick={add} cls="w-full flex items-center justify-center gap-2 py-4 shadow-md"><Ic d={P.plus}/>Add Movie</Btn>
<div className="grid grid-cols-2 gap-3"><Stat l="Movies Watched" v={st.n}/><Stat l="Total Spent" v={money(st.sum)}/><Stat l="Average per Movie" v={money(st.avg)}/><Stat l="Highest Spent" v={money(st.max)}/></div>
<div className="card p-4 fade"><div className="text-sm font-semibold">This month</div><div className="text-sm text-[#8C8175] mt-1">{cur.n} movie{cur.n===1?'':'s'} · {money(cur.s)} spent</div></div>
<div className="card p-4 fade"><div className="text-sm font-semibold mb-3">Spending, last 6 months</div><Bars data={six}/></div>
<div><div className="flex justify-between items-center mb-2"><h2 className="font-semibold">Recently watched</h2>{ms.length>0&&<button onClick={()=>go('movies')} className="text-sm text-[#987653]">See all</button>}</div>
<div className="space-y-3">{recent.length?recent.map(m=><Row key={m.id} m={m} onEdit={edit} onDel={del}/>):<Empty t="No movies yet. Tap “Add Movie” to log your first one."/>}</div></div></div>}

function Movies({ms,edit,del,add}){
const[q,setQ]=useState(''),[sort,setSort]=useState('new'),[vf,setVf]=useState(''),[mf,setMf]=useState('');
const list=useMemo(()=>ms.filter(m=>m.name.toLowerCase().includes(q.trim().toLowerCase())&&(!vf||m.verdict===vf)&&(!mf||m.date.startsWith(mf))).sort((a,b)=>(a.date.localeCompare(b.date)||a.id.localeCompare(b.id))*(sort==='new'?-1:1)),[ms,q,sort,vf,mf]);
return <div className="space-y-4"><Title sub={ms.length+' saved'}>My Movies</Title>
<div className="relative"><span className="absolute left-3 top-3.5 text-[#8C8175]"><Ic d={P.search} s={18}/></span><input className="inp" style={{paddingLeft:40}} placeholder="Search by movie name" value={q} onChange={e=>setQ(e.target.value)}/></div>
<div className="grid grid-cols-2 gap-2"><select className="inp" value={sort} onChange={e=>setSort(e.target.value)}><option value="new">Newest first</option><option value="old">Oldest first</option></select>
<select className="inp" value={vf} onChange={e=>setVf(e.target.value)}><option value="">All verdicts</option>{VERDICTS.map(v=><option key={v}>{v}</option>)}</select></div>
<div className="flex gap-2"><input type="month" className="inp" value={mf} onChange={e=>setMf(e.target.value)}/>{mf&&<Btn kind="ghost" onClick={()=>setMf('')}>Clear</Btn>}</div>
<div className="space-y-3">{list.length?list.map(m=><Row key={m.id} m={m} onEdit={edit} onDel={del}/>):ms.length?<Empty t="No movies match these filters."/>:<Empty t="Your diary is empty."/>}</div>
<button onClick={add} aria-label="Add movie" className="tap fixed right-4 bottom-24 w-14 h-14 rounded-full bg-[#987653] text-white shadow-lg flex items-center justify-center"><Ic d={P.plus} s={24}/></button></div>}

function Expenses({st}){
const years=Object.keys(st.yr).sort().reverse(),[y,setY]=useState(''),yy=years.includes(y)?y:(years[0]||String(new Date().getFullYear()));
const data=MN.map((l,i)=>({l:l[0],v:(st.mo[yy+'-'+String(i+1).padStart(2,'0')]||{s:0}).s}));
const months=MN.map((l,i)=>({l,...(st.mo[yy+'-'+String(i+1).padStart(2,'0')]||{n:0,s:0})})).filter(m=>m.n).reverse();
const mxv=Math.max(1,...Object.values(st.vd));
return <div className="space-y-5"><Title sub="All figures come from your saved movies">Expenses</Title>
<div className="grid grid-cols-2 gap-3"><Stat l="Total Spent" v={money(st.sum)}/><Stat l="Movies Watched" v={st.n}/><Stat l="Average per Movie" v={money(st.avg)}/><Stat l="Highest Spent" v={money(st.max)}/></div>
<div className="card p-4 fade"><div className="flex justify-between items-center mb-3"><div className="text-sm font-semibold">Monthly spending</div>
<select className="inp" style={{width:'auto',padding:'6px 10px'}} value={yy} onChange={e=>setY(e.target.value)}>{(years.length?years:[yy]).map(v=><option key={v}>{v}</option>)}</select></div><Bars data={data}/></div>
<div className="card p-4 fade"><div className="text-sm font-semibold mb-2">Yearly spending</div>{years.length?years.map(v=><div key={v} className="flex justify-between py-2 border-b border-[#F2EBDD] last:border-0 text-sm"><span>{v} <span className="text-[#8C8175]">· {st.yr[v].n} movies</span></span><b>{money(st.yr[v].s)}</b></div>):<p className="text-sm text-[#8C8175]">Nothing yet.</p>}</div>
<div className="card p-4 fade"><div className="text-sm font-semibold mb-2">Months of {yy}</div>{months.length?months.map(m=><div key={m.l} className="flex justify-between py-2 border-b border-[#F2EBDD] last:border-0 text-sm"><span>{m.l} <span className="text-[#8C8175]">· {m.n} movies</span></span><b>{money(m.s)}</b></div>):<p className="text-sm text-[#8C8175]">No movies in this year.</p>}</div>
<div className="card p-4 fade"><div className="text-sm font-semibold mb-3">Verdicts</div>{VERDICTS.map(v=><div key={v} className="flex items-center gap-3 mb-2"><span className="w-24"><Badge v={v}/></span><div className="flex-1 h-2 rounded bg-[#F2EBDD]"><div className="h-2 rounded bg-[#D8C4A8]" style={{width:st.vd[v]/mxv*100+'%',transition:'width .5s'}}/></div><span className="text-sm w-6 text-right">{st.vd[v]}</span></div>)}</div></div>}

function Settings({ms,doImport,clear}){
const[t,setT]=useState(''),[msg,setMsg]=useState('');
const json=()=>JSON.stringify({app:'my-movie-diary',version:1,exportedAt:new Date().toISOString(),movies:ms},null,2);
const exp=()=>{const j=json();setT(j);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='movie-diary-backup.json';a.click()}catch(e){}setMsg('Backup ready below. If no download started, tap Copy and save the text.')};
const copy=async()=>{const j=t||json();setT(j);try{await navigator.clipboard.writeText(j);setMsg('Copied to clipboard.')}catch(e){setMsg('Select the text below and copy it manually.')}};
const file=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{setT(String(r.result));setMsg('File loaded. Tap Import to add it.')};r.readAsText(f);e.target.value=''};
return <div className="space-y-5"><Title sub="Backup and app info">Settings</Title>
<div className="card p-4 fade space-y-3"><div className="font-semibold">Backup &amp; restore</div>
<div className="grid grid-cols-2 gap-2"><Btn onClick={exp}>Export data</Btn><Btn kind="ghost" onClick={copy}>Copy</Btn></div>
<textarea className="inp" rows="5" placeholder="Backup JSON appears here. Paste a backup here to import." value={t} onChange={e=>setT(e.target.value)}/>
<div className="grid grid-cols-2 gap-2"><label className="tap rounded-xl px-4 py-3 text-sm font-medium bg-[#F2EBDD] text-center cursor-pointer">Choose file<input type="file" accept=".json,application/json" className="hidden" onChange={file}/></label><Btn onClick={()=>setMsg(doImport(t))}>Import</Btn></div>
{msg&&<p className="text-sm text-[#8C8175]">{msg}</p>}</div>
<div className="card p-4 fade"><div className="font-semibold mb-2">Danger zone</div><Btn kind="danger" onClick={clear} cls="w-full">Clear all movie records</Btn></div>
<div className="card p-4 fade text-sm text-[#8C8175]"><div className="font-semibold text-[#46372B] mb-1">About</div>My Movie Diary v1.0. Your {ms.length} record{ms.length===1?'':'s'} are saved only in this browser on this device. Export a backup now and then.</div></div>}

function Form({init,onSave,onClose}){
const[f,setF]=useState(init||{name:'',date:today(),amount:'',verdict:''}),[er,setEr]=useState({});
const set=(k,v)=>setF(p=>({...p,[k]:v}));
const submit=e=>{e.preventDefault();const x={},a=parseFloat(f.amount);
if(!f.name.trim())x.name='Enter a movie name';if(!f.date)x.date='Pick a date';if(f.amount===''||isNaN(a)||a<0)x.amount='Enter a valid amount';if(!VERDICTS.includes(f.verdict))x.verdict='Choose a verdict';
setEr(x);if(Object.keys(x).length)return;onSave({...f,name:f.name.trim(),amount:a})};
const E=({k})=>er[k]?<p className="text-xs text-red-700 mt-1">{er[k]}</p>:null;
return <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{background:'rgba(70,55,43,.45)'}}>
<form onSubmit={submit} className="fade w-full max-w-md bg-[#FAF8F3] rounded-t-3xl sm:rounded-3xl p-5 space-y-3 max-h-[92vh] overflow-y-auto" style={{paddingBottom:'calc(20px + env(safe-area-inset-bottom,0px))'}}>
<div className="flex justify-between items-center"><h2 className="serif text-xl font-bold">{init?'Edit movie':'Add movie'}</h2><button type="button" aria-label="Close" onClick={onClose} className="p-2 rounded-full bg-[#F2EBDD]"><Ic d={P.x} s={18}/></button></div>
<div><label className="text-xs text-[#8C8175]">Movie name</label><input className="inp" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="e.g. Interstellar"/><E k="name"/></div>
<div><label className="text-xs text-[#8C8175]">Watching date</label><input type="date" className="inp" value={f.date} onChange={e=>set('date',e.target.value)}/><E k="date"/></div>
<div><label className="text-xs text-[#8C8175]">Amount spent (₹)</label><input type="number" inputMode="decimal" min="0" step="any" className="inp" value={f.amount} onChange={e=>set('amount',e.target.value)} placeholder="0"/><E k="amount"/></div>
<div><label className="text-xs text-[#8C8175]">Verdict</label><div className="flex flex-wrap gap-2 mt-1">{VERDICTS.map(v=><button type="button" key={v} onClick={()=>set('verdict',v)} className={'tap px-3 py-2 rounded-full text-sm border '+(f.verdict===v?'bg-[#987653] text-white border-[#987653]':'bg-white border-[#D8C4A8]')}>{v}</button>)}</div><E k="verdict"/></div>
<button type="submit" className="tap w-full rounded-xl py-3.5 font-medium bg-[#987653] text-white">Save Movie</button></form></div>}

function Confirm({title,text,yes,onYes,onNo}){return <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{background:'rgba(70,55,43,.45)'}}><div className="fade card p-5 w-full max-w-sm"><h3 className="serif text-lg font-bold">{title}</h3><p className="text-sm text-[#8C8175] mt-1 mb-4">{text}</p><div className="grid grid-cols-2 gap-2"><Btn kind="ghost" onClick={onNo}>Cancel</Btn><Btn kind="danger" onClick={onYes}>{yes}</Btn></div></div></div>}

function App(){
const[ms,setMs]=useState(load),[tab,setTab]=useState('home'),[form,setForm]=useState(null),[conf,setConf]=useState(null),[toast,setToast]=useState('');
useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(ms))}catch(e){}},[ms]);
const st=useMemo(()=>calc(ms),[ms]);
const say=m=>{setToast(m);setTimeout(()=>setToast(''),2200)};
const save=m=>{if(form.id){setMs(p=>p.map(x=>x.id===form.id?{...m,id:form.id}:x));say('Movie updated')}else{setMs(p=>[...p,{...m,id:uid()}]);say('Movie saved')}setForm(null)};
const del=m=>setConf({title:'Delete this movie?',text:'“'+m.name+'” will be removed from your diary.',yes:'Delete',run:()=>{setMs(p=>p.filter(x=>x.id!==m.id));say('Movie deleted')}});
const clear=()=>setConf({title:'Clear all records?',text:'This permanently deletes all '+ms.length+' movies. Export a backup first if unsure.',yes:'Clear all',run:()=>{setMs([]);say('All records cleared')}});
const doImport=txt=>{try{let d=JSON.parse(txt);if(d&&d.movies)d=d.movies;if(!Array.isArray(d))throw 0;
const ok=d.filter(m=>m&&typeof m.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)&&m.amount!==''&&isFinite(m.amount)&&VERDICTS.includes(m.verdict)).map(m=>({id:String(m.id||uid()),name:m.name,date:m.date,amount:+m.amount,verdict:m.verdict}));
const ids=new Set(ms.map(m=>m.id)),fresh=ok.filter(m=>!ids.has(m.id));setMs(p=>[...p,...fresh]);
return 'Imported '+fresh.length+' movie(s)'+(ok.length-fresh.length?', skipped '+(ok.length-fresh.length)+' duplicates':'')+(d.length-ok.length?', ignored '+(d.length-ok.length)+' invalid':'')+'.'}catch(e){return 'That doesn’t look like a valid backup.'}};
const add=()=>setForm({}),edit=m=>setForm(m);
const tabs=[['home','Dashboard',P.home],['movies','My Movies',P.film],['exp','Expenses',P.chart],['set','Settings',P.set]];
return <div className="max-w-xl mx-auto px-4 pt-6" style={{paddingBottom:110}}>
<div key={tab}>{tab==='home'&&<Dashboard ms={ms} st={st} add={add} edit={edit} del={del} go={setTab}/>}{tab==='movies'&&<Movies ms={ms} edit={edit} del={del} add={add}/>}{tab==='exp'&&<Expenses st={st}/>}{tab==='set'&&<Settings ms={ms} doImport={doImport} clear={clear}/>}</div>
<nav className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-[#F2EBDD]" style={{paddingBottom:'env(safe-area-inset-bottom,0px)'}}><div className="max-w-xl mx-auto grid grid-cols-4">
{tabs.map(([k,l,d])=><button key={k} onClick={()=>{setTab(k);window.scrollTo(0,0)}} className={'tap flex flex-col items-center gap-1 py-2.5 text-[11px] '+(tab===k?'text-[#987653] font-semibold':'text-[#8C8175]')}><Ic d={d} s={22}/>{l}</button>)}</div></nav>
{form&&<Form init={form.id?form:null} onSave={save} onClose={()=>setForm(null)}/>}
{conf&&<Confirm {...conf} onNo={()=>setConf(null)} onYes={()=>{conf.run();setConf(null)}}/>}
{toast&&<div className="fade fixed left-1/2 -translate-x-1/2 bottom-28 z-50 px-4 py-2 rounded-full text-sm text-white bg-[#46372B]">{toast}</div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
